name: CI Verify

on:
  push:
    branches: [main]
    tags: ["phase-*", "v*"]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build client and headless
        run: npm run build

      - name: Run full verification suite
        run: npm run verify
