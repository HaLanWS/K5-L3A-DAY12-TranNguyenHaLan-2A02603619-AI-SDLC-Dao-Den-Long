<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Đảo Đèn Lồng — Ba Hòn Đảo</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        user-select: none;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #0e1430;
        font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
        color: #f5f1e6;
      }
      #app {
        position: relative;
        width: 100%;
        height: 100%;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
      .hud-layer {
        position: absolute;
        inset: 0;
        pointer-events: none;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: 16px 20px;
      }
      .hud-top {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 12px;
      }
      .panel {
        background: rgba(14, 20, 48, 0.78);
        border: 1px solid rgba(242, 193, 78, 0.35);
        backdrop-filter: blur(8px);
        border-radius: 14px;
        padding: 10px 16px;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
      }
      .label {
        color: #cbbba0;
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.06em;
      }
      .value-gold {
        color: #f2c14e;
        font-weight: 700;
        font-size: 18px;
      }
      .flames-bar {
        display: flex;
        gap: 8px;
        margin-top: 6px;
      }
      .flame-dot {
        width: 18px;
        height: 18px;
        border-radius: 50%;
        background: radial-gradient(circle at 40% 35%, #ffe9b0, #ffb347 68%, #c8102e);
        box-shadow: 0 0 10px rgba(255, 179, 71, 0.85);
        transition: opacity 0.2s, transform 0.2s;
      }
      .flame-dot.lost {
        background: rgba(91, 95, 110, 0.35);
        box-shadow: none;
        transform: scale(0.8);
      }
      .center-banner {
        text-align: center;
        min-width: 170px;
      }
      .night-title {
        font-size: 13px;
        color: #f2c14e;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        margin-bottom: 4px;
      }
      .timer-text {
        font-variant-numeric: tabular-nums;
        font-size: 24px;
        font-weight: 700;
        color: #f5f1e6;
      }
      .timer-text.danger {
        color: #ff5a5f;
        animation: pulseBlink 0.7s infinite;
      }
      @keyframes pulseBlink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.38; }
      }
      .wind-badge {
        margin-top: 4px;
        font-size: 12px;
        color: #8fa3b8;
        min-height: 16px;
      }
      .wind-badge.warn {
        color: #f2c14e;
        font-weight: 700;
      }
      .wind-badge.active {
        color: #ff5a5f;
        font-weight: 700;
      }
      .right-stats {
        text-align: right;
      }
      .lantern-summary {
        display: flex;
        align-items: center;
        justify-content: flex-end;
        gap: 8px;
        font-size: 16px;
        font-weight: 700;
        color: #ffb347;
        margin-bottom: 4px;
      }
      .hud-bottom {
        display: flex;
        justify-content: space-between;
        align-items: flex-end;
        gap: 12px;
      }
      .bottom-spacer {
        width: 180px;
      }
      .bottom-center {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
        flex: 1;
      }
      .context-prompt {
        background: rgba(255, 179, 71, 0.22);
        border: 1px solid #f2c14e;
        color: #f5f1e6;
        border-radius: 999px;
        padding: 7px 18px;
        font-size: 14px;
        font-weight: 700;
        opacity: 0;
        transform: translateY(6px);
        transition: opacity 0.18s, transform 0.18s;
      }
      .context-prompt.visible {
        opacity: 1;
        transform: translateY(0);
      }
      .mote-bar {
        display: flex;
        gap: 6px;
        background: rgba(14, 20, 48, 0.8);
        border: 1px solid rgba(242, 193, 78, 0.35);
        border-radius: 999px;
        padding: 8px 14px;
      }
      .mote-slot {
        width: 16px;
        height: 16px;
        border-radius: 50%;
        border: 1px solid rgba(255, 229, 138, 0.45);
        background: rgba(27, 35, 80, 0.7);
        transition: all 0.18s;
      }
      .mote-slot.filled {
        background: radial-gradient(circle, #fff6c2, #ffe58a 70%, #ffb347);
        box-shadow: 0 0 10px #ffe58a;
        border-color: #fff6c2;
      }
      .abilities-panel {
        display: flex;
        gap: 10px;
        align-items: flex-end;
      }
      .ability-box {
        width: 82px;
        text-align: center;
        background: rgba(14, 20, 48, 0.82);
        border: 1px solid rgba(242, 193, 78, 0.35);
        border-radius: 12px;
        padding: 8px 6px;
      }
      .ability-box.ready {
        border-color: #f2c14e;
        box-shadow: 0 0 12px rgba(242, 193, 78, 0.25);
      }
      .ability-box.charm-active {
        border-color: #c8102e;
        box-shadow: 0 0 14px rgba(200, 16, 46, 0.55);
      }
      .ability-key {
        font-size: 11px;
        color: #f2c14e;
        font-weight: 700;
      }
      .ability-name {
        font-size: 12px;
        color: #f5f1e6;
        margin: 2px 0;
      }
      .ability-cd {
        font-size: 12px;
        color: #8fa3b8;
        font-variant-numeric: tabular-nums;
      }
      .offscreen-arrow {
        position: absolute;
        width: 34px;
        height: 34px;
        pointer-events: none;
        display: none;
        align-items: center;
        justify-content: center;
        font-size: 22px;
        color: #ffb347;
        text-shadow: 0 0 10px #ffb347;
        transform: translate(-50%, -50%);
      }
      .overlay {
        position: absolute;
        inset: 0;
        background: radial-gradient(circle at center, rgba(27, 35, 80, 0.78), rgba(14, 20, 48, 0.94));
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 20;
        padding: 20px;
      }
      .overlay.hidden {
        display: none;
      }
      .card {
        max-width: 520px;
        width: 100%;
        background: rgba(14, 20, 48, 0.96);
        border: 1px solid rgba(242, 193, 78, 0.45);
        border-radius: 20px;
        padding: 28px 30px;
        text-align: center;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
      }
      .card h1 {
        font-size: 28px;
        color: #f2c14e;
        margin-bottom: 10px;
      }
      .card .subtitle {
        font-size: 15px;
        color: #f5f1e6;
        line-height: 1.55;
        margin-bottom: 18px;
      }
      .card .quote {
        font-style: italic;
        color: #ffe9b0;
        background: rgba(255, 179, 71, 0.1);
        border-left: 3px solid #f2c14e;
        padding: 10px 14px;
        border-radius: 8px;
        text-align: left;
        margin-bottom: 18px;
        font-size: 14px;
      }
      .btn-stack {
        display: flex;
        flex-direction: column;
        gap: 10px;
        align-items: center;
      }
      .btn-row {
        display: flex;
        gap: 10px;
        justify-content: center;
        flex-wrap: wrap;
      }
      .primary-btn {
        cursor: pointer;
        border: none;
        border-radius: 12px;
        padding: 11px 24px;
        font-size: 15px;
        font-weight: 700;
        color: #0e1430;
        background: linear-gradient(135deg, #ffe9b0, #ffb347);
        min-width: 180px;
      }
      .secondary-btn {
        cursor: pointer;
        border: 1px solid rgba(242, 193, 78, 0.45);
        border-radius: 12px;
        padding: 10px 20px;
        font-size: 14px;
        font-weight: 600;
        color: #f5f1e6;
        background: rgba(27, 35, 80, 0.85);
        min-width: 180px;
      }
      .setting-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        margin: 12px 0;
        text-align: left;
        font-size: 14px;
      }
      .setting-row input[type="range"] {
        width: 190px;
        accent-color: #f2c14e;
      }
      .stats-grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 10px;
        margin-bottom: 18px;
      }
      .stat-box {
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(242, 193, 78, 0.25);
        border-radius: 12px;
        padding: 10px;
      }
      .stat-box .k {
        font-size: 11px;
        color: #cbbba0;
        text-transform: uppercase;
      }
      .stat-box .v {
        font-size: 20px;
        font-weight: 700;
        color: #f2c14e;
        margin-top: 2px;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/client/main.ts"></script>
  </body>
</html>
